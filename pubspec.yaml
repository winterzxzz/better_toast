name: better_toast
description: "Customizable toast notifications for Flutter: a snackbar alternative you can show with no context. Stacking, queue, update by id, promise toasts and theming."
version: 0.1.0
repository: https://github.com/winterzxzz/better_toast
issue_tracker: https://github.com/winterzxzz/better_toast/issues
screenshots:
  - description: Success, error with action, warning and info toasts stacked at the top.
    path: doc/screenshots/types.webp
  - description: A loading toast updated in place until it shows success.
    path: doc/screenshots/promise.webp
  - description: Every ToastPosition, plus start and end positions in right-to-left.
    path: doc/screenshots/positions.webp
  - description: Dark theme toasts at the bottom with a progress bar and actions.
    path: doc/screenshots/dark_bottom.webp
  - description: Glassmorphism toasts made with a single ToastStyle.
    path: doc/screenshots/glass.webp
  - description: A custom builder toast and per-type colors.
    path: doc/screenshots/custom.webp
topics:
  - toast
  - notification
  - snackbar
  - overlay
  - ui

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
