name: better_toast
description: >-
  Beautiful, highly customizable toasts for Flutter. Show from anywhere,
  stack and queue, update by id, promise toasts, theming and custom builders.
version: 0.1.0
repository: https://github.com/winterzxzz/better_toast
issue_tracker: https://github.com/winterzxzz/better_toast/issues
topics:
  - toast
  - notification
  - snackbar
  - overlay
  - ui

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
