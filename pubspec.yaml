name: better_toast
description: "Customizable toast notifications for Flutter: a snackbar alternative you can show with no context. Stacking, queue, update by id, promise toasts and theming."
version: 0.1.0
repository: https://github.com/winterzxzz/better_toast
issue_tracker: https://github.com/winterzxzz/better_toast/issues
screenshots:
  - description: Success, error, warning and info toasts stacked over a photo app.
    path: doc/screenshots/01_types.webp
  - description: A loading toast from BetterToast.promise, updated in place into a success.
    path: doc/screenshots/02_promise.webp
  - description: Glass, gradient, pill and soft toasts styled with ToastStyle.
    path: doc/screenshots/03_styles.webp
  - description: Dark mode with actions, close buttons and progress bars.
    path: doc/screenshots/04_dark.webp
  - description: Every position, mirrored for right-to-left layouts.
    path: doc/screenshots/05_positions.webp
  - description: Fully custom toasts with BetterToast.custom.
    path: doc/screenshots/06_custom.webp
topics:
  - toast
  - notification
  - snackbar
  - overlay
  - ui

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
